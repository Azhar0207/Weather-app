<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="container">
      <div class="search">
        <input type="text" placeholder="Enter city name" />
        <button><img src="icons/search.png" alt="" /></button>
      </div>

      <div class="weather">
        <img src="icons/cloudy.png" alt="" class="weather-icon" />
        <h1 class="temp">32°c</h1>
        <h2 class="city">Odisha</h2>

        <div class="weather-col">
          <div class="col">
            <img src="icons/icons8-humidity-100.png" alt=""/>
            <div>
              <p class="humidity">50%</p>
              <p class="text">Humidity</p>
            </div>
          </div>

          <div class="col">
            <img src="icons/icons8-wind-100.png" alt="" />
            <div>
              <p class="wind">20 Km/h</p>
              <p class="text">Wind</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
